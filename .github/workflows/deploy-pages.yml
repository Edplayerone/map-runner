name: Deploy to GitHub Pages

# GitHub Pages serves this site from the gh-pages branch (branch-based
# hosting was auto-enabled when gh-pages was first pushed). The workflow
# token isn't allowed to manage the Pages site via the API, so instead of
# actions/deploy-pages we simply mirror main into gh-pages on every merge.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror main to gh-pages
        run: git push origin HEAD:gh-pages --force
